<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymarket Bot Dashboard</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #101828;
        --muted: #667085;
        --border: #d0d5dd;
        --primary: #0b63f6;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #e9f0ff 0%, #f8fbff 35%, #eef8ef 100%);
        color: var(--text);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      .wrap {
        max-width: 1240px;
        margin: 22px auto;
        padding: 0 14px;
      }
      .grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        width: 100%;
        box-sizing: border-box;
        overflow: hidden;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 10px;
        margin: 12px 0;
      }
      .field {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        background: #fbfdff;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .field input[type="number"],
      .field input[type="text"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 8px;
        font-size: 13px;
        box-sizing: border-box;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: auto;
      }
      th,
      td {
        border-bottom: 1px solid #e9edf5;
        text-align: left;
        padding: 8px 6px;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      pre {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        height: min(52vh, 640px);
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow: auto;
        background: #f8fbff;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: pre;
      }
      .table-wrap {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
      }
      .targets-compact {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 8px 12px;
        margin-top: 8px;
      }
      .target-item {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 9px;
        background: #fbfdff;
        font-size: 13px;
      }
      .log-wrap {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
      }
      .chip {
        display: inline-block;
        font-size: 12px;
        color: #0f172a;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid #dbe4f5;
        background: #f6f9ff;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        gap: 10px;
        margin: 10px 0 12px;
      }
      .stat {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        background: #fbfdff;
      }
      .stat .label {
        color: var(--muted);
        font-size: 12px;
      }
      .stat .value {
        margin-top: 3px;
        font-weight: 700;
        font-size: 18px;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge.win {
        color: #065f46;
        background: #d1fae5;
      }
      .badge.lose {
        color: #991b1b;
        background: #fee2e2;
      }
      .badge.pending {
        color: #92400e;
        background: #fef3c7;
      }
      .select {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 8px;
        background: #fff;
      }
      @media (max-width: 1050px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .targets-compact {
          grid-template-columns: repeat(3, minmax(150px, 1fr));
        }
        .stats-grid {
          grid-template-columns: repeat(3, minmax(120px, 1fr));
        }
      }
      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .targets-compact {
          grid-template-columns: repeat(2, minmax(140px, 1fr));
        }
        .stats-grid {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Polymarket 多盘口机器人控制台</h1>
      <div class="muted">保存后会写入 <code>config/runtime.json</code>，并通知 bot 在下一轮自动热重载。</div>
      <div class="row" style="margin: 8px 0 0">
        <button id="refreshBalanceBtn">刷新余额</button>
        <span id="balanceInfo" class="muted">余额加载中...</span>
      </div>

      <div class="grid">
        <section class="card">
          <h2>运行与风控配置</h2>
          <div class="row" style="margin-bottom: 10px">
            <button id="loadBtn">刷新配置</button>
            <button id="saveBtn">保存并生效</button>
            <span id="cfgStatus" class="muted"></span>
          </div>

          <div class="form-grid">
            <div class="field">
              <label>轮询间隔(秒)</label>
              <input id="pollIntervalSec" type="number" min="5" step="1" />
            </div>
            <div class="field">
              <label>最小 Edge</label>
              <input id="minEdge" type="number" min="0" step="0.001" />
            </div>
            <div class="field">
              <label>单笔默认金额($)</label>
              <input id="baseBetUsd" type="number" min="0.1" step="0.1" />
            </div>
            <div class="field">
              <label>单笔最大金额($)</label>
              <input id="maxBetUsd" type="number" min="0.1" step="0.1" />
            </div>
            <div class="field">
              <label>最小下单份额</label>
              <input id="minOrderShares" type="number" min="1" step="1" />
            </div>
            <div class="field">
              <label>下单价格激进度</label>
              <input id="priceAggression" type="number" min="0" step="0.001" />
            </div>
            <div class="field">
              <label>盘口冷却(秒)</label>
              <input id="cooldownSeconds" type="number" min="0" step="1" />
            </div>
            <div class="field">
              <label>自动领取间隔(秒)</label>
              <input id="claimCooldownSec" type="number" min="30" step="1" />
            </div>
            <div class="field">
              <label>最大回撤(%, 0=关闭)</label>
              <input id="maxDrawdownPct" type="number" min="0" step="0.1" />
            </div>
            <div class="field">
              <label>最大未结算笔数(0=关闭)</label>
              <input id="maxOpenTrades" type="number" min="0" step="1" />
            </div>
            <div class="field">
              <label>当日最大交易数(0=关闭)</label>
              <input id="maxTradesPerDay" type="number" min="0" step="1" />
            </div>
            <div class="field">
              <label>连续亏损熔断(0=关闭)</label>
              <input id="maxConsecutiveLosses" type="number" min="0" step="1" />
            </div>
            <div class="field">
              <label>最小进场剩余秒数</label>
              <input id="minEntrySeconds" type="number" min="5" step="1" />
            </div>
            <div class="field">
              <label>最小进场价格</label>
              <input id="minEntryPrice" type="number" min="0.01" max="0.99" step="0.01" />
            </div>
            <div class="field">
              <label>最大进场价格</label>
              <input id="maxEntryPrice" type="number" min="0.01" max="0.99" step="0.01" />
            </div>
            <div class="field">
              <label>最小 Overround</label>
              <input id="minOverround" type="number" min="0.5" max="1.5" step="0.01" />
            </div>
            <div class="field">
              <label>最大 Overround</label>
              <input id="maxOverround" type="number" min="0.5" max="1.5" step="0.01" />
            </div>
            <div class="field">
              <label>反向单最小剩余秒数</label>
              <input id="reverseMinEntrySeconds" type="number" min="5" step="1" />
            </div>
            <div class="field">
              <label>反向单最小模型概率</label>
              <input id="reverseMinModelProb" type="number" min="0" max="1" step="0.01" />
            </div>
            <div class="field">
              <label>反向单最小 Edge 倍数</label>
              <input id="reverseMinEdgeMultiplier" type="number" min="1" step="0.1" />
            </div>
          </div>

          <div class="row" style="margin: 10px 0 14px">
            <label class="toggle"><input id="dryRun" type="checkbox" /> dryRun（不真实下单）</label>
            <label class="toggle"><input id="autoClaim" type="checkbox" /> 自动领取收益</label>
            <label class="toggle"><input id="enableReverseFallback" type="checkbox" /> 启用反向单</label>
          </div>

          <h2>盘口启用开关 <span class="chip" id="enabledCount">0 / 0</span></h2>
          <div class="table-wrap">
            <div id="targetsList" class="targets-compact"></div>
          </div>
        </section>

        <section class="card">
          <h2>交易表现</h2>
          <div class="row" style="margin-bottom: 8px">
            <button id="refreshTradesBtn">刷新交易</button>
            <button id="clearTradesBtn">清空交易记录</button>
            <label class="muted">每页</label>
            <select id="tradePageSize" class="select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
            </select>
            <label class="muted">盘口</label>
            <select id="tradeTarget" class="select">
              <option value="">全部</option>
            </select>
            <label class="muted">状态</label>
            <select id="tradeResolved" class="select">
              <option value="">全部</option>
              <option value="true">已结算</option>
              <option value="false">待结算</option>
            </select>
            <span id="tradeStatus" class="muted"></span>
          </div>

          <div class="stats-grid">
            <div class="stat"><div class="label">总交易</div><div class="value" id="sTotal">0</div></div>
            <div class="stat"><div class="label">已结算</div><div class="value" id="sSettled">0</div></div>
            <div class="stat"><div class="label">待结算</div><div class="value" id="sPending">0</div></div>
            <div class="stat"><div class="label">胜场</div><div class="value" id="sWins">0</div></div>
            <div class="stat"><div class="label">负场</div><div class="value" id="sLosses">0</div></div>
            <div class="stat"><div class="label">胜率</div><div class="value" id="sWinRate">0%</div></div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>进场时间</th>
                  <th>盘口</th>
                  <th>方向</th>
                  <th>结果</th>
                  <th>进场价</th>
                  <th>结算价</th>
                  <th>marketId</th>
                </tr>
              </thead>
              <tbody id="tradesBody"></tbody>
            </table>
          </div>

          <div class="row" style="margin-top: 10px">
            <button id="tradePrevBtn">上一页</button>
            <button id="tradeNextBtn">下一页</button>
            <span id="tradePageInfo" class="muted"></span>
          </div>
        </section>

        <section class="card">
          <h2>运行日志</h2>
          <div class="row" style="margin-bottom: 8px">
            <button id="refreshLogBtn">刷新日志</button>
            <button id="clearLogBtn">清空日志</button>
            <label class="muted" for="tailInput">tail</label>
            <input id="tailInput" type="number" value="200" min="50" max="2000" style="width: 90px" />
            <span id="logStatus" class="muted"></span>
          </div>
          <div class="log-wrap">
            <pre id="logArea"></pre>
          </div>
        </section>
      </div>
    </div>

    <script>
      let fullConfig = null;
      const tradeQuery = { page: 1, pageSize: 20, targetId: "", resolved: "" };

      const cfgStatus = document.getElementById("cfgStatus");
      const logArea = document.getElementById("logArea");
      const logStatus = document.getElementById("logStatus");
      const tailInput = document.getElementById("tailInput");
      const targetsList = document.getElementById("targetsList");
      const enabledCount = document.getElementById("enabledCount");
      const balanceInfo = document.getElementById("balanceInfo");

      const tradeStatus = document.getElementById("tradeStatus");
      const tradeTarget = document.getElementById("tradeTarget");
      const tradeResolved = document.getElementById("tradeResolved");
      const tradePageSize = document.getElementById("tradePageSize");
      const tradesBody = document.getElementById("tradesBody");
      const tradePrevBtn = document.getElementById("tradePrevBtn");
      const tradeNextBtn = document.getElementById("tradeNextBtn");
      const tradePageInfo = document.getElementById("tradePageInfo");

      const num = (id, fallback) => {
        const v = Number(document.getElementById(id).value);
        return Number.isFinite(v) ? v : fallback;
      };

      const setValue = (id, value) => {
        const el = document.getElementById(id);
        el.value = value == null ? "" : String(value);
      };

      const fmtNumber = (v, d = 4) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return "-";
        return n.toFixed(d);
      };

      const fmtTime = (iso) => {
        if (!iso) return "-";
        const t = new Date(iso);
        if (Number.isNaN(t.getTime())) return String(iso);
        return t.toLocaleString();
      };

      function renderTargets(targets) {
        targetsList.innerHTML = "";
        let enabled = 0;

        for (let i = 0; i < targets.length; i += 1) {
          const t = targets[i];
          if (t.enabled) enabled += 1;

          const horizonText = Number(t.horizonMin) === 60 ? "1H" : `${t.horizonMin}M`;
          const name = `${t.coin || "-"}-${horizonText}`;
          const row = document.createElement("label");
          row.className = "target-item";
          row.innerHTML = `
            <input type="checkbox" class="target-enabled" data-idx="${i}" ${t.enabled ? "checked" : ""} />
            <span>${name}</span>
          `;
          targetsList.appendChild(row);
        }

        enabledCount.textContent = `${enabled} / ${targets.length}`;
      }

      function renderTradeTargets(targets) {
        const prev = tradeTarget.value || "";
        tradeTarget.innerHTML = '<option value="">全部</option>';
        for (const t of targets || []) {
          const opt = document.createElement("option");
          opt.value = t.id || "";
          opt.textContent = `${t.id} (${t.coin} ${Number(t.horizonMin) === 60 ? "1h" : `${t.horizonMin}m`})`;
          tradeTarget.appendChild(opt);
        }
        tradeTarget.value = prev;
      }

      function renderTradeSummary(summary) {
        document.getElementById("sTotal").textContent = String(summary?.totalTrades ?? 0);
        document.getElementById("sSettled").textContent = String(summary?.settledTrades ?? 0);
        document.getElementById("sPending").textContent = String(summary?.pendingTrades ?? 0);
        document.getElementById("sWins").textContent = String(summary?.wins ?? 0);
        document.getElementById("sLosses").textContent = String(summary?.losses ?? 0);
        const winRate = Number(summary?.winRate ?? 0);
        document.getElementById("sWinRate").textContent = `${(winRate * 100).toFixed(2)}%`;
      }

      function renderTrades(items) {
        tradesBody.innerHTML = "";
        if (!Array.isArray(items) || items.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = '<td colspan="7" class="muted">暂无交易记录</td>';
          tradesBody.appendChild(tr);
          return;
        }

        for (const t of items) {
          const tr = document.createElement("tr");
          const targetLabel = t.targetId || `${t.coin || "-"}_${Number(t.horizonMin) === 60 ? "1h" : `${t.horizonMin || "-"}m`}`;
          let badgeClass = "pending";
          if (t.status === "WIN") badgeClass = "win";
          if (t.status === "LOSE") badgeClass = "lose";
          tr.innerHTML = `
            <td>${fmtTime(t.entryTime)}</td>
            <td>${targetLabel}</td>
            <td>${t.side || "-"}</td>
            <td><span class="badge ${badgeClass}">${t.status || "PENDING"}</span></td>
            <td>${fmtNumber(t.entryRefPrice, 6)}</td>
            <td>${t.settleRefPrice == null ? "-" : fmtNumber(t.settleRefPrice, 6)}</td>
            <td title="${t.marketId || ""}" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.marketId || "-"}</td>
          `;
          tradesBody.appendChild(tr);
        }
      }

      function fillForm(cfg) {
        setValue("pollIntervalSec", cfg.runtime.pollIntervalSec);
        setValue("minEdge", cfg.prediction.minEdge);
        setValue("baseBetUsd", cfg.prediction.baseBetUsd);
        setValue("maxBetUsd", cfg.prediction.maxBetUsd);
        setValue("minOrderShares", cfg.prediction.minOrderShares);
        setValue("priceAggression", cfg.prediction.priceAggression);
        setValue("cooldownSeconds", cfg.marketFilter.cooldownSeconds);
        setValue("claimCooldownSec", cfg.runtime.claimCooldownSec || 300);
        setValue("maxDrawdownPct", cfg.runtime.maxDrawdownPct || 0);
        setValue("maxOpenTrades", cfg.runtime.maxOpenTrades ?? 6);
        setValue("maxTradesPerDay", cfg.runtime.maxTradesPerDay ?? 120);
        setValue("maxConsecutiveLosses", cfg.runtime.maxConsecutiveLosses ?? 4);

        document.getElementById("dryRun").checked = Boolean(cfg.runtime.dryRun);
        document.getElementById("autoClaim").checked = Boolean(cfg.runtime.autoClaim);
        document.getElementById("enableReverseFallback").checked = Boolean(cfg.prediction.enableReverseFallback);

        setValue("minEntrySeconds", cfg.marketFilter.minEntrySeconds || 45);
        setValue("minEntryPrice", cfg.prediction.minEntryPrice ?? 0.05);
        setValue("maxEntryPrice", cfg.prediction.maxEntryPrice ?? 0.9);
        setValue("minOverround", cfg.prediction.minOverround ?? 0.95);
        setValue("maxOverround", cfg.prediction.maxOverround ?? 1.06);
        setValue("reverseMinEntrySeconds", cfg.prediction.reverseMinEntrySeconds ?? 90);
        setValue("reverseMinModelProb", cfg.prediction.reverseMinModelProb ?? 0.42);
        setValue("reverseMinEdgeMultiplier", cfg.prediction.reverseMinEdgeMultiplier ?? 1.3);

        const targets = Array.isArray(cfg.prediction.targets) ? cfg.prediction.targets : [];
        renderTargets(targets);
        renderTradeTargets(targets);
      }

      function readFormToConfig() {
        const next = JSON.parse(JSON.stringify(fullConfig));

        next.runtime.dryRun = document.getElementById("dryRun").checked;
        next.runtime.autoClaim = document.getElementById("autoClaim").checked;
        next.runtime.pollIntervalSec = Math.max(5, Math.round(num("pollIntervalSec", next.runtime.pollIntervalSec || 20)));
        next.runtime.claimCooldownSec = Math.max(30, Math.round(num("claimCooldownSec", next.runtime.claimCooldownSec || 300)));
        next.runtime.maxDrawdownPct = Math.max(0, num("maxDrawdownPct", next.runtime.maxDrawdownPct || 0));
        next.runtime.maxOpenTrades = Math.max(0, Math.round(num("maxOpenTrades", next.runtime.maxOpenTrades ?? 6)));
        next.runtime.maxTradesPerDay = Math.max(0, Math.round(num("maxTradesPerDay", next.runtime.maxTradesPerDay ?? 120)));
        next.runtime.maxConsecutiveLosses = Math.max(0, Math.round(num("maxConsecutiveLosses", next.runtime.maxConsecutiveLosses ?? 4)));

        next.prediction.minEdge = Math.max(0, num("minEdge", next.prediction.minEdge || 0.02));
        next.prediction.baseBetUsd = Math.max(0.1, num("baseBetUsd", next.prediction.baseBetUsd || 1.5));
        next.prediction.maxBetUsd = Math.max(next.prediction.baseBetUsd, num("maxBetUsd", next.prediction.maxBetUsd || 2.6));
        next.prediction.minOrderShares = Math.max(1, num("minOrderShares", next.prediction.minOrderShares || 5));
        next.prediction.priceAggression = Math.max(0, num("priceAggression", next.prediction.priceAggression || 0.01));
        next.prediction.minEntryPrice = Math.max(0.01, Math.min(0.99, num("minEntryPrice", next.prediction.minEntryPrice ?? 0.05)));
        next.prediction.maxEntryPrice = Math.max(next.prediction.minEntryPrice, Math.min(0.99, num("maxEntryPrice", next.prediction.maxEntryPrice ?? 0.9)));
        next.prediction.minOverround = Math.max(0.5, Math.min(1.5, num("minOverround", next.prediction.minOverround ?? 0.95)));
        next.prediction.maxOverround = Math.max(next.prediction.minOverround, Math.min(1.5, num("maxOverround", next.prediction.maxOverround ?? 1.06)));
        next.prediction.enableReverseFallback = document.getElementById("enableReverseFallback").checked;
        next.prediction.reverseMinEntrySeconds = Math.max(5, Math.round(num("reverseMinEntrySeconds", next.prediction.reverseMinEntrySeconds ?? 90)));
        next.prediction.reverseMinModelProb = Math.max(0, Math.min(1, num("reverseMinModelProb", next.prediction.reverseMinModelProb ?? 0.42)));
        next.prediction.reverseMinEdgeMultiplier = Math.max(1, num("reverseMinEdgeMultiplier", next.prediction.reverseMinEdgeMultiplier ?? 1.3));

        next.marketFilter.cooldownSeconds = Math.max(0, Math.round(num("cooldownSeconds", next.marketFilter.cooldownSeconds || 20)));
        next.marketFilter.minEntrySeconds = Math.max(5, Math.round(num("minEntrySeconds", next.marketFilter.minEntrySeconds || 45)));

        const checks = document.querySelectorAll(".target-enabled");
        checks.forEach((el) => {
          const idx = Number(el.getAttribute("data-idx"));
          if (!Number.isFinite(idx)) return;
          if (!next.prediction.targets[idx]) return;
          next.prediction.targets[idx].enabled = Boolean(el.checked);
        });

        return next;
      }

      async function loadConfig() {
        cfgStatus.textContent = "加载中...";
        try {
          const resp = await fetch("/api/config");
          const data = await resp.json();
          if (!resp.ok) throw new Error(data?.error || `HTTP ${resp.status}`);
          fullConfig = data;
          fillForm(data);
          cfgStatus.textContent = "配置已加载";
        } catch (err) {
          cfgStatus.textContent = `加载失败: ${String(err)}`;
        }
      }

      async function saveConfig() {
        if (!fullConfig) return;
        cfgStatus.textContent = "保存中...";
        try {
          const next = readFormToConfig();
          const resp = await fetch("/api/config", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(next),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data?.error || `HTTP ${resp.status}`);

          fullConfig = next;
          fillForm(next);
          cfgStatus.textContent = `已保存，bot 将在下一轮自动重载（token=${data.reloadToken || "-"}）`;
        } catch (err) {
          cfgStatus.textContent = `保存失败: ${String(err)}`;
        }
      }

      async function loadTrades() {
        try {
          tradeStatus.textContent = "加载中...";
          const query = new URLSearchParams({
            page: String(tradeQuery.page),
            pageSize: String(tradeQuery.pageSize),
          });
          if (tradeQuery.targetId) query.set("targetId", tradeQuery.targetId);
          if (tradeQuery.resolved) query.set("resolved", tradeQuery.resolved);

          const resp = await fetch(`/api/trades?${query.toString()}`);
          const data = await resp.json();
          if (!resp.ok) throw new Error(data?.error || `HTTP ${resp.status}`);

          renderTradeSummary(data.summary || {});
          renderTrades(data.items || []);
          tradePageInfo.textContent = `第 ${data.pagination.page} / ${data.pagination.totalPages} 页，共 ${data.pagination.total} 条`;
          tradePrevBtn.disabled = !data.pagination.hasPrev;
          tradeNextBtn.disabled = !data.pagination.hasNext;
          tradeQuery.page = data.pagination.page;
          tradeStatus.textContent = `更新于 ${new Date().toLocaleTimeString()}`;
        } catch (err) {
          tradeStatus.textContent = `读取失败: ${String(err)}`;
        }
      }

      async function clearTrades() {
        try {
          tradeStatus.textContent = "清空中...";
          const resp = await fetch("/api/trades/clear", { method: "POST" });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data?.error || `HTTP ${resp.status}`);
          tradeQuery.page = 1;
          await loadTrades();
          tradeStatus.textContent = `交易记录已清空 ${new Date().toLocaleTimeString()}`;
        } catch (err) {
          tradeStatus.textContent = `清空失败: ${String(err)}`;
        }
      }

      async function loadAccount() {
        try {
          balanceInfo.textContent = "余额加载中...";
          const resp = await fetch("/api/account");
          const data = await resp.json();
          if (!resp.ok) throw new Error(data?.error || `HTTP ${resp.status}`);
          const equity = Number(data?.totalEquityUsd ?? 0);
          const collateral = Number(data?.collateralUsdc ?? 0);
          const user = data?.user || "-";
          const msg = `当前总资产≈$${equity.toFixed(2)} (可用USDC≈$${collateral.toFixed(2)}) | ${user}`;
          balanceInfo.textContent = data?.collateralError ? `${msg} | ${data.collateralError}` : msg;
        } catch (err) {
          balanceInfo.textContent = `余额读取失败: ${String(err)}`;
        }
      }

      async function loadLogs() {
        try {
          const tail = Number(tailInput.value || "200");
          const resp = await fetch(`/api/logs?tail=${encodeURIComponent(tail)}`);
          const data = await resp.json();
          logArea.textContent = Array.isArray(data.lines) ? data.lines.join("\n") : "";
          logArea.scrollTop = logArea.scrollHeight;
          logStatus.textContent = `更新于 ${new Date().toLocaleTimeString()}`;
        } catch (err) {
          logStatus.textContent = `读取失败: ${String(err)}`;
        }
      }

      async function clearLogs() {
        try {
          const resp = await fetch("/api/logs/clear", { method: "POST" });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data?.error || `HTTP ${resp.status}`);
          await loadLogs();
          logStatus.textContent = `日志已清空 ${new Date().toLocaleTimeString()}`;
        } catch (err) {
          logStatus.textContent = `清空失败: ${String(err)}`;
        }
      }

      document.getElementById("loadBtn").addEventListener("click", async () => {
        await loadConfig();
        tradeQuery.page = 1;
        await loadTrades();
      });
      document.getElementById("saveBtn").addEventListener("click", saveConfig);
      document.getElementById("refreshLogBtn").addEventListener("click", loadLogs);
      document.getElementById("clearLogBtn").addEventListener("click", clearLogs);
      document.getElementById("refreshTradesBtn").addEventListener("click", loadTrades);
      document.getElementById("clearTradesBtn").addEventListener("click", clearTrades);
      document.getElementById("refreshBalanceBtn").addEventListener("click", loadAccount);

      tradeTarget.addEventListener("change", async () => {
        tradeQuery.targetId = tradeTarget.value || "";
        tradeQuery.page = 1;
        await loadTrades();
      });
      tradeResolved.addEventListener("change", async () => {
        tradeQuery.resolved = tradeResolved.value || "";
        tradeQuery.page = 1;
        await loadTrades();
      });
      tradePageSize.addEventListener("change", async () => {
        tradeQuery.pageSize = Number(tradePageSize.value || "20");
        tradeQuery.page = 1;
        await loadTrades();
      });
      tradePrevBtn.addEventListener("click", async () => {
        tradeQuery.page = Math.max(1, tradeQuery.page - 1);
        await loadTrades();
      });
      tradeNextBtn.addEventListener("click", async () => {
        tradeQuery.page += 1;
        await loadTrades();
      });

      (async () => {
        await loadConfig();
        await loadTrades();
        await loadAccount();
        await loadLogs();
        setInterval(loadLogs, 2000);
        setInterval(loadTrades, 5000);
        setInterval(loadAccount, 10000);
      })();
    </script>
  </body>
</html>
