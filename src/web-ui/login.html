<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Login</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap");

    :root {
      --bg-0: #f5f7f2;
      --bg-1: #eef5ff;
      --bg-2: #fbfcff;
      --card: rgba(255, 255, 255, 0.92);
      --text: #102033;
      --muted: #5f6f86;
      --border: #d5dfea;
      --primary: #0f766e;
      --primary-2: #1d4ed8;
      --danger: #b42318;
      --shadow: 0 18px 48px rgba(16, 32, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(29, 78, 216, 0.1), transparent 35%),
        radial-gradient(circle at 100% 0%, rgba(15, 118, 110, 0.1), transparent 30%),
        linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 48%, var(--bg-2) 100%);
    }

    .shell {
      width: min(100%, 1020px);
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 420px);
      overflow: hidden;
      border: 1px solid rgba(213, 223, 234, 0.92);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero {
      padding: 40px;
      background:
        radial-gradient(circle at 15% 20%, rgba(29, 78, 216, 0.12), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(15, 118, 110, 0.1), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(244, 249, 255, 0.92));
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(16, 32, 51, 0.06);
      color: #315170;
      font-size: 12px;
      font-weight: 600;
    }

    h1,
    h2 {
      margin: 0;
      font-family: "Space Grotesk", "Plus Jakarta Sans", sans-serif;
    }

    h1 {
      margin-top: 18px;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1;
    }

    .hero p {
      margin: 16px 0 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .hero-card {
      padding: 16px;
      border: 1px solid rgba(213, 223, 234, 0.9);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
    }

    .hero-card strong {
      display: block;
      font-size: 18px;
    }

    .hero-card span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-panel {
      padding: 32px;
      display: grid;
      align-content: center;
      gap: 18px;
      background: rgba(255, 255, 255, 0.96);
    }

    .auth-head {
      display: grid;
      gap: 8px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid #8dbdff;
      outline-offset: 2px;
    }

    button {
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[disabled] {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      min-height: 22px;
      font-size: 13px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--primary);
    }

    @media (max-width: 920px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="hero">
      <span class="kicker">Protected Dashboard</span>
      <h1>登录后进入控制台</h1>
      <p>这个页面只保护 Web 控制台访问，不影响后台 bot 的运行。你可以把服务直接部署到线上，再用一个简单密码保护配置、日志和交易面板。</p>
      <div class="hero-grid">
        <div class="hero-card">
          <strong>配置面板</strong>
          <span>在线修改挂单梯子、轮询间隔和目标盘口。</span>
        </div>
        <div class="hero-card">
          <strong>执行面板</strong>
          <span>查看周期执行、交易记录、余额与赎回状态。</span>
        </div>
        <div class="hero-card">
          <strong>日志面板</strong>
          <span>持续观察运行日志，快速排查线上问题。</span>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-head">
        <h2>输入访问密码</h2>
        <!-- <div class="muted">密码从服务器的 <code>.env</code> 中读取，变量名是 <code>WEB_PASSWORD</code>。</div> -->
      </div>

      <form id="loginForm">
        <label for="password">
          访问密码
          <input id="password" name="password" type="password" autocomplete="current-password"
            placeholder="请输入 Web 访问密码" required />
        </label>
        <button id="submitBtn" type="submit">进入控制台</button>
        <div id="status" class="status"></div>
      </form>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    function setStatus(message, tone) {
      status.textContent = message || "";
      status.className = `status${tone ? ` ${tone}` : ""}`;
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      setStatus("登录中...", "");
      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data?.error || `HTTP ${resp.status}`);
        }
        setStatus("登录成功，正在进入控制台...", "success");
        window.location.href = "/";
      } catch (error) {
        setStatus(`登录失败: ${String(error)}`, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    passwordInput.focus();
  </script>
</body>

</html>
